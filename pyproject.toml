[project]
name = "business-insights-agent"
version = "0.2.0"
description = "An AI agent that answers what and why questions about business data, with evidence for every finding."
readme = "README.md"
license = "MIT"
authors = [{ name = "Lei Wang" }]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.11.0",
    "duckdb>=1.5.6",
    "faker>=40.40.0",
    "fastembed>=0.9.0",
    "langfuse>=4.17.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2.3.0",
    "numpy>=2.5.3",
    "py-rust-stemmers>=0.1.8",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
