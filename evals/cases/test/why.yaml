# "Why" cases for the test data (data/scenarios/test.yaml), scored once at the end
# (DEV_PLAN Phase 6). Same fields as evals/cases/why.yaml; answer keys point into
# data/test_manifest.json. Written on 2026-10-19, before any run on the test data.
# why-nsw-early-theft is the incident whose cause (early-claim fraud) is outside the six
# typical causes the agent's instructions name.

cases:
  - id: why-wa-claims-june-2026
    question: Why did claims in Western Australia jump in June 2026?
    role: head_of_claims
    kind: incident
    answer_key: perth_winter_storm
    must_mention:
      - [WX-001, severe storm, winter storm, storm]
      - [Perth]

  - id: why-queensland-repair-shops
    question: Are any of our Queensland repair shops costing us more than they should?
    role: fraud_team_lead
    kind: incident
    answer_key: brisbane_shop_inflation
    must_mention:
      - [RS-016, Smith Collision Repairs]
      - [ADJ-022, Katherine Garcia]

  - id: why-paid-jump-may-2026
    question: Why did paid claims jump in mid-May 2026?
    role: head_of_claims
    kind: incident
    answer_key: duplicate_payment_load
    flags_data_quality: true
    must_mention:
      - [reload-2026-05-16, reload batch, reloaded]
      - [duplicate, twice, double]

  - id: why-vic-tas-slower-to-close
    question: Why are VIC & TAS claims taking longer to close since June 2026?
    role: claims_ops_manager
    kind: incident
    answer_key: vic_tas_adjusters_leave
    must_mention:
      - [ADJ-010, ADJ-011, ADJ-012, Kevin Smith, Sharon Murphy, Deborah Torres,
         three adjusters, 3 adjusters, three of the eight, three of eight]

  - id: why-nsw-early-theft
    question: Why did motor theft claims in New South Wales go up in 2026?
    role: head_of_claims
    kind: incident
    answer_key: nsw_online_early_theft
    must_mention:
      - [online]
      - [within, soon after, shortly after, days of, weeks of, days after, weeks after,
         new policies, newly, early]
      - [fraud, suspicious, red flag]

  - id: why-september-drop
    question: Did claims really drop in September 2026?
    role: claims_ops_manager
    kind: incident
    answer_key: incomplete_latest_month
    must_mention:
      - [incomplete, reported late, reporting lag, reporting delay, not yet reported,
         late report, partial]

  - id: why-queensland-storm-february
    question: Queensland home storm claims in February 2026 were far above mid-2025. Is something wrong?
    role: actuarial_analyst
    kind: control
    answer_key: queensland_storm_season
