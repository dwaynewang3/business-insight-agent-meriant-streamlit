# "What" cases for the test data (data/scenarios/test.yaml), scored once at the end
# (DEV_PLAN Phase 6). They reuse the dev templates' questions and hand-written reference SQL
# (evals/cases/what.yaml) with new parameters: one case per template, 22 in all, several
# aimed at the test data's incidents. Written on 2026-10-19, before any run on the test data.
# Two questions are the same as dev ones (the dev set asks them for every region), asked of
# the test data: open claims per adjuster in VIC & TAS, and open claims in West & South.
templates_from: ../what.yaml
known_duplicate_batches: [reload-2026-05-16]

cases:
  claim_frequency_by_state: [{product: motor, period: 2026-Q1}]
  loss_ratio_by_product: [{period: 2025-H2}]
  average_claim_cost: [{product: home, state: WA, period: 2026-06}]
  average_claim_cost_by_product: [{period: 2025-Q4}]
  claim_count_by_cause: [{product: home, region: West & South, period: 2026-06}]
  claim_count_by_month: [{state: WA, period: 2026-H1}]
  open_claims_by_adjuster: [{region: VIC & TAS}]
  median_cycle_time_by_region: [{period: 2026-04..2026-07}]
  paid_amount_by_month: [{period: 2026-H1}]
  paid_amount_by_payee: [{period: 2026-04}]
  policies_in_force_by_state: [{product: motor, period: 2026-03}]
  earned_premium_by_product: [{period: 2026-Q2}]
  claim_count_by_channel: [{product: motor, period: 2026-H1}]
  top_states_by_loss_ratio: [{n: 2, product: motor, period: 2026-H1}]
  cause_share: [{product: motor, cause: theft, period: 2026-Q2}]
  claim_count_change: [{product: motor, period: 2025-Q1, period_b: 2026-Q1}]
  shop_average_claim_cost: [{metro: Brisbane, period: 2026-Q2}]
  open_claims_by_region: [{region: West & South}]
  incurred_losses_total: [{product: motor, period: 2026-H1}]
  claims_reported: [{period: 2026-05}]
  claim_count_total: [{period: 2026-Q2}]
  paid_amount_total: [{period: 2026-05}]
