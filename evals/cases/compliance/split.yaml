# Which claim files the compliance workflow is developed on, and which are held out for the
# final scoring (decided 2026-10-16: 18 and 9). Fixed on 2026-10-17, before any compliance run.
# Held-out results are looked at only in the final scoring (B7), and reported separately.
#
# How the 9 were chosen (by rule, not by looking at any results):
# - one claim from each kind of breach that has two or more, so development still sees every
#   kind: authority 2 of 4, exclusions 2 of 4, fraud 1 of 3, settlement 1 of 3,
#   service levels 1 of 2;
# - kinds with a single claim (notification, triage, cover, documentation) stay in development;
# - 2 of the 7 compliant claims: one trap and one clean control;
# - from each pair built on the same facts with opposite verdicts (GC-009/010, GC-015/016),
#   at most one is held out, so the held-out set still tests the distinction.
held_out:
  GC-005: authority, per-claim vs per-payment limit
  GC-021: authority, role-based rule independent of amount
  GC-008: exclusions, threshold depends on licence type
  GC-015: exclusions, depends on the endorsement list (its pair GC-016 is in development)
  GC-013: fraud, recompute a score with an interaction rule
  GC-023: settlement, tax arithmetic with order of operations
  GC-025: service levels, one policy tightens another
  GC-019: trap, catastrophe surge authority and excess
  GC-027: control, a denial with nothing paid
