# Follow-up cases: a first question, then a follow-up that only makes sense after it.
#
# The follow-up is graded exactly like the "what" case named in grade_as, whose reference SQL
# the tests already check. So the agent passes only if it carries over everything the
# follow-up leaves out: the metric, the period, the breakdown. The first answer isn't graded.
#
# Fields:
#   role       who asks, as in what.yaml (it matches the grade_as case)
#   first      the first question
#   follow_up  the follow-up, in the same session
#   grade_as   the id of the "what" case that defines the right answer to the follow-up

cases:
  - id: followup-frequency-same-for-home
    role: actuarial_analyst
    first: What was the motor claim frequency by state in Q2 2026?
    follow_up: Now show the same for home.
    grade_as: what-claim-frequency-by-state-home-2026-q2

  - id: followup-loss-ratio-next-period
    role: head_of_claims
    first: What was the loss ratio for each product in 2025?
    follow_up: And for the first half of 2026?
    grade_as: what-loss-ratio-by-product-2026-h1

  - id: followup-average-cost-by-product
    role: actuarial_analyst
    first: What was our overall average claim cost in Q2 2026?
    follow_up: Now break that down by product.
    grade_as: what-average-claim-cost-by-product-2026-q2

  - id: followup-open-claims-other-region
    role: claims_ops_manager
    first: How many open claims does each West & South adjuster have?
    follow_up: What about NSW & ACT?
    grade_as: what-open-claims-by-adjuster-nsw-act

  - id: followup-paid-by-payee-other-month
    role: head_of_claims
    first: How much did we pay out on claims in June 2025, by payee type?
    follow_up: Now do August 2026.
    grade_as: what-paid-amount-by-payee-2026-08
