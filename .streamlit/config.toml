# Settings for the UI (Streamlit reads this file when started from the project root).

[server]
# Don't stop at Streamlit's first-run email prompt, which fails without a keyboard to answer
# it (an IDE's command runner, CI). The app prints its address instead of opening a browser.
headless = true
# The address isn't set here: a hosted copy has to accept connections from its host's proxy.
# `make demo` passes `--server.address localhost`, so on your own machine only this computer
# can open the app: live mode spends API credit and, for the fraud team lead, shows personal
# data, so it shouldn't be reachable from the rest of the network.

[browser]
# Don't send usage statistics to Streamlit.
gatherUsageStats = false
